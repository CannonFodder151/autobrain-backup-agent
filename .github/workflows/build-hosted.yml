name: build-hosted

# Build autobrain-backup-agent multi-arch image for the Oracle Hosted stack (EP5).
# Pushes a :hosted tag (amd64 + arm64) to GHCR.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (default: hosted)'
        required: false
        default: hosted

concurrency:
  group: build-hosted-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        env:
          TAG: ${{ github.event.inputs.tag || 'hosted' }}
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --push \
            --tag "ghcr.io/cannonfodder151/autobrain-backup-agent:${TAG}" \
            .
          echo "==> pushed ghcr.io/cannonfodder151/autobrain-backup-agent:${TAG}"

      - name: Verify manifest platforms
        env:
          TAG: ${{ github.event.inputs.tag || 'hosted' }}
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.oci.image.index.v1+json" \
            "https://ghcr.io/v2/cannonfodder151/autobrain-backup-agent/manifests/${TAG}" \
            -o /tmp/index.json
          python3 - <<'PY'
          import json
          d = json.load(open("/tmp/index.json"))
          archs = sorted((m["platform"]["architecture"], m["platform"]["os"]) for m in d["manifests"])
          assert ("amd64","linux") in archs, ("amd64 missing", archs)
          assert ("arm64","linux") in archs, ("arm64 missing", archs)
          print("verified platforms:", archs)
          PY
